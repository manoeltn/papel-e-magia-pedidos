body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface-solid); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.money-txt { color: var(--blue-dark); font-family: var(--font-display); font-weight: 700; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface-solid); border-bottom: 3px solid transparent; border-image: linear-gradient(90deg, #f9a8cf, #fde68a, #a7f3d0, #a5cdf5, #d8c4f5) 1; }
.wrap { max-width: 1100px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top .wrap { display: flex; align-items: center; gap: 14px 18px; flex-wrap: wrap; padding-block: 8px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand img { height: 56px; width: auto; display: block; border-radius: 12px; }
.brand h1 { font-family: var(--font-round); font-weight: 600; font-size: 22px; line-height: 1.1; background: linear-gradient(90deg, var(--pink) 0%, #f79bc4 45%, var(--blue) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand small { display: block; color: var(--muted); font-size: 12px; font-weight: 600; }
.tabs { display: flex; gap: 4px; background: var(--pink-soft); padding: 4px; border-radius: 999px; }
.tabs button { border: 0; background: transparent; padding: 6px 16px; border-radius: 999px; font-weight: 700; color: var(--pink-dark); }
.tabs button[aria-selected="true"] { background: var(--surface-solid); color: var(--pink); box-shadow: 0 1px 4px rgba(249, 66, 147, .25); }
.spacer { flex: 1; }
.btn { border: 1.5px solid var(--line); background: var(--surface-solid); padding: 8px 16px; border-radius: 999px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--fg); }
.btn:hover { border-color: var(--pink); }
.btn.primary { background: var(--pink); color: #fff; border-color: var(--pink); box-shadow: 0 3px 10px rgba(249, 66, 147, .3); }
.btn.primary:hover { background: var(--pink-dark); }
.btn.blue { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn.small { padding: 5px 12px; font-size: 13px; }

main.wrap { padding-block: 20px 48px; display: flex; flex-direction: column; gap: 18px; }
.notice { border: 1.5px dashed var(--line); border-radius: 14px; padding: 10px 14px; color: var(--muted); background: var(--surface); }
.notice.warn { border-color: #f2c14e; color: #7a4b00; background: #fff7df; }
.page-title { font-size: 28px; color: var(--pink); font-weight: 700; }

.summary { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 10px 14px; text-align: left; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
button.stat:hover { border-color: var(--pink); }
.stat[aria-pressed="true"] { border-color: var(--pink); box-shadow: inset 0 0 0 1.5px var(--pink); }
.stat .lbl { font-size: 13px; color: var(--muted); font-weight: 700; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .val { font-family: var(--font-display); font-size: 26px; font-weight: 700; color: var(--plum); }
.summary .money { grid-column: span 3; flex-direction: row; justify-content: space-between; align-items: baseline; padding-block: 12px; }

.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.list { display: flex; flex-direction: column; background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; overflow: hidden; }

.row .who strong { display: block; font-family: var(--font-display); font-size: 17px; color: var(--plum); }
.row .who span, .row .sch span { color: var(--muted); font-size: 13px; }

  const state = { tab: "pedidos", filtro: null, busca: "", pedidos: [], clientes: [], precos: {}, sedex: {}, loaded: false, modo: "carregando", erro: "" };
  let db = null;
  const mem = { pedidos: new Map(), clientes: new Map() };

  // ---------- utilidades ----------
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const brl = v => (Number(v) || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  const parseMoney = s => {
    s = String(s ?? "").replace(/[R$\s]/g, "");
    if (!s) return 0;
    if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
    const n = parseFloat(s);
    return isFinite(n) ? Math.round(n * 100) / 100 : 0;
  };
  const moneyIn = v => (Number(v) || 0) ? Number(v).toFixed(2).replace(".", ",") : "";
  const digits = s => String(s ?? "").replace(/\D/g, "");
  const norm = s => String(s ?? "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ").trim();
  const fmtPhone = s => { const d = digits(s); if (d.length === 11) return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`; if (d.length === 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`; return s || ""; };
  const waNumber = s => { let d = digits(s); if (d.length === 10 || d.length === 11) d = "55" + d; return d.length >= 12 ? d : ""; };
  const fmtDate = iso => { if (!iso) return ""; const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }); };
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const juntar = arr => arr.length <= 1 ? (arr[0] || "") : arr.slice(0, -1).join(", ") + " e " + arr[arr.length - 1];
  function maisDiasUteis(iso, n) { const d = new Date(iso); let k = 0; while (k < n) { d.setDate(d.getDate() + 1); const w = d.getDay(); if (w !== 0 && w !== 6) k++; } return d.toISOString(); }

  const catalogo = () => CATALOGO_PADRAO.map(c => ({ ...c, preco: state.precos[c.id] != null ? Number(state.precos[c.id]) : c.preco }));
  const produto = id => catalogo().find(c => c.id === id);
  // Crianças do pedido (pedidos antigos guardavam uma só criança em campos soltos)
  const criancasDe = p => (p.criancas && p.criancas.length) ? p.criancas : [{ nome: p.aluno || "", tema: p.tema || "", escola: p.escola || "", serie: p.serie || "" }];
  const entregaDe = p => ({ tipo: "retirada", frete: 0, endereco: "", cep: "", rastreio: "", ...(p.entrega || {}) });

  // ---------- Sedex: cálculo estimado (a página não consegue consultar os Correios) ----------
  // Embalagens da loja: envelope 32x23 cm só para etiquetas; caixa 25x15x20 cm para o resto.
  const EMBALAGENS = {
    envelope: { nome: "Envelope 32x23 cm", det: "Pedidos só com etiquetas" },
    caixa: { nome: "Caixa 25x15x20 cm", det: "Pedidos com squeeze, agenda, chaveiros, kits e outros" },
  };
  const LINK_SUPERAPP = "https://www.correios.com.br/atendimento/ferramentas/super-app/superapp-baixe-aqui";
  const DIM = { envelope: "32 x 23 cm (envelope)", caixa: "25 x 15 x 20 cm (caixa: comprimento 25, largura 15, altura 20)" };
  // Média do valor real pago no app dos Correios, por embalagem e faixa
  function mediasReais() {
    const cfg = sedexCfg(), acc = {};
    state.pedidos.forEach(p => {
      const e = entregaDe(p); const real = Number(e.freteReal) || 0;
      if (e.tipo !== "sedex" || !real || digits(e.cep).length !== 8) return;
      const emb = e.embalagem || embalagemDe(p.itens); const { faixa } = faixaDoCep(e.cep, cfg);
      if (!emb || !faixa) return;
      const k = emb + "." + faixa; acc[k] = acc[k] || { soma: 0, n: 0 }; acc[k].soma += real; acc[k].n++;
    });
    Object.values(acc).forEach(a => a.media = Math.round(a.soma / a.n * 100) / 100);
    return acc;
  }
  function textoCorreios(p) {
    const e = entregaDe(p), emb = e.embalagem || embalagemDe(p.itens), cfg = sedexCfg();
    return `Sedex · pedido nº ${p.numero}\nCEP de origem: ${fmtCep(cfg.origemCep)}\nCEP de destino: ${fmtCep(e.cep) || "não informado"}\nEmbalagem: ${emb ? DIM[emb] : "não definida"}\nDestinatário: ${p.responsavel || ""}${e.endereco ? "\nEndereço: " + e.endereco : ""}`;
  }
  const SO_ENVELOPE = ["glossy-p", "glossy-m", "glossy-g", "vinil-p", "vinil-m", "vinil-g", "termo"];
  const FAIXAS = [
    { id: "local", nome: "Perto da loja", det: "Grande São Paulo (CEP começando com 0)", curto: "perto da loja" },
    { id: "estado", nome: "Mesmo estado", det: "Interior e litoral de SP", curto: "mesmo estado" },
    { id: "regiao", nome: "Mesma região", det: "RJ, MG e ES", curto: "Sudeste" },
    { id: "proxima", nome: "Regiões próximas", det: "Sul e Centro-Oeste", curto: "Sul ou Centro-Oeste" },
    { id: "distante", nome: "Regiões distantes", det: "Nordeste e Norte", curto: "Nordeste ou Norte" },
  ];
  // Valores de partida: suposições, não são preços oficiais. Ajustáveis na aba Catálogo.
  const SEDEX_PADRAO = {
    origemCep: "04202020",
    envelope: { local: 17, estado: 23, regiao: 30, proxima: 36, distante: 48 },
    caixa: { local: 24, estado: 34, regiao: 48, proxima: 60, distante: 88 },
  };
  const UF_CEP = [[1000,19999,"SP"],[20000,28999,"RJ"],[29000,29999,"ES"],[30000,39999,"MG"],[40000,48999,"BA"],[49000,49999,"SE"],[50000,56999,"PE"],[57000,57999,"AL"],[58000,58999,"PB"],[59000,59999,"RN"],[60000,63999,"CE"],[64000,64999,"PI"],[65000,65999,"MA"],[66000,68899,"PA"],[68900,68999,"AP"],[69000,69299,"AM"],[69300,69399,"RR"],[69400,69899,"AM"],[69900,69999,"AC"],[70000,72799,"DF"],[72800,72999,"GO"],[73000,73699,"DF"],[73700,76799,"GO"],[76800,76999,"RO"],[77000,77999,"TO"],[78000,78899,"MT"],[79000,79999,"MS"],[80000,87999,"PR"],[88000,89999,"SC"],[90000,99999,"RS"]];
  const REGIAO_UF = { SP: "Sudeste", RJ: "Sudeste", ES: "Sudeste", MG: "Sudeste", PR: "Sul", SC: "Sul", RS: "Sul", DF: "Centro-Oeste", GO: "Centro-Oeste", MT: "Centro-Oeste", MS: "Centro-Oeste", BA: "Nordeste", SE: "Nordeste", PE: "Nordeste", AL: "Nordeste", PB: "Nordeste", RN: "Nordeste", CE: "Nordeste", PI: "Nordeste", MA: "Nordeste", PA: "Norte", AP: "Norte", AM: "Norte", RR: "Norte", AC: "Norte", RO: "Norte", TO: "Norte" };
  const ufDoCep = cep => { const d = digits(cep); if (d.length !== 8) return null; const n = +d.slice(0, 5); const f = UF_CEP.find(([a, b]) => n >= a && n <= b); return f ? f[2] : null; };
  const fmtCep = cep => { const d = digits(cep); return d.length === 8 ? d.slice(0, 5) + "-" + d.slice(5) : cep || ""; };
  const sedexCfg = () => {
    const sx = state.sedex || {};
    return { origemCep: sx.origemCep || SEDEX_PADRAO.origemCep, envelope: { ...SEDEX_PADRAO.envelope, ...(sx.envelope || {}) }, caixa: { ...SEDEX_PADRAO.caixa, ...(sx.caixa || {}) } };
  };
  function embalagemDe(itens) {
    const validos = (itens || []).filter(i => (i.desc || "").trim() && (Number(i.qtd) || 0) > 0);
    if (!validos.length) return null;
    return validos.every(i => SO_ENVELOPE.includes(i.produto)) ? "envelope" : "caixa";
  }
  function faixaDoCep(cepDestino, cfg) {
    const uf = ufDoCep(cepDestino), ufO = ufDoCep(cfg.origemCep);
    if (!uf || !ufO) return { uf, faixa: null };
    const d = digits(cepDestino), o = digits(cfg.origemCep);
    const perto = (o[0] === "0" && d[0] === "0") || d.slice(0, 3) === o.slice(0, 3);
    const rd = REGIAO_UF[uf], ro = REGIAO_UF[ufO], centro = ["Sudeste", "Sul", "Centro-Oeste"];
    const faixa = perto ? "local" : uf === ufO ? "estado" : rd === ro ? "regiao" : (centro.includes(rd) && centro.includes(ro)) ? "proxima" : "distante";
    return { uf, faixa };
  }
  function calcularSedex(cepDestino, itens) {
    const cfg = sedexCfg();
    const { uf, faixa } = faixaDoCep(cepDestino, cfg);
    if (!uf) return null;
    const emb = embalagemDe(itens);
    if (!faixa || !emb) return { uf, faixa, emb };
    return { uf, faixa, emb, valor: Number(cfg[emb][faixa]) || 0 };
  }

  function totais(p) {
    const sub = (p.itens || []).reduce((a, i) => a + (Number(i.qtd) || 0) * (Number(i.preco) || 0), 0);
    const frete = Number(entregaDe(p).frete) || 0;
    const total = Math.max(0, Math.round((sub + frete - (Number(p.desconto) || 0)) * 100) / 100);
    const pago = Number(p.pago) || 0;
    return { sub, frete, total, pago, saldo: Math.max(0, Math.round((total - pago) * 100) / 100) };
  }

  // Reconhece um produto do catálogo numa linha de texto livre
  function acharProduto(t) {
    const n = " " + norm(t).replace(/[^a-z0-9 ]/g, " ") + " ";
    const tam = /\b(g|grande)\b/.test(n) ? "g" : /\b(m|medio)\b/.test(n) ? "m" : /\b(p|pequeno)\b/.test(n) ? "p" : null;
    if (/termo/.test(n)) return "termo";
    if (/vinil|prova d/.test(n)) return tam ? "vinil-" + tam : null;
    if (/glossy/.test(n)) return tam ? "glossy-" + tam : null;
    if (/higiene/.test(n)) return "kit-higiene";
    if (/squeeze|garrafa/.test(n)) return /bico|automatic/.test(n) ? "squeeze-bico" : "squeeze";
    if (/tabuada/.test(n)) return "tabuada";
    if (/chaveiro/.test(n)) return "chaveiro";
    if (/\btag\b/.test(n)) return "tag";
    if (/agenda/.test(n)) return "agenda";
    if (/papelaria|fofa|fofo/.test(n)) return "kit-fofa";
    return null;
  }

  // Lê uma mensagem colada do WhatsApp: crianças ("Nome:", "Tema:"), entrega e itens.
  // Itens que aparecem depois de um "Nome:" ficam com aquela criança.
  function lerMensagem(txt) {
    const criancas = [], campos = {}, itens = [];
    let atual = -1;
    const nova = () => { criancas.push({ nome: "", tema: "", escola: "", serie: "" }); atual = criancas.length - 1; };
    const crianca = () => { if (atual < 0) nova(); return criancas[atual]; };
    String(txt || "").split(/\r?\n/).forEach(raw => {
      let l = raw.replace(/^\[[^\]]*\]\s*[^:]{1,40}:\s*/, "");
      l = l.replace(/^\s*(?:[-–•*▪·>]|\d+[.)]\s|[✅☑✔▪▫\u{1F539}\u{1F538}\u{1F4CC}\u{1F449}]️?)+\s*/u, "").replace(/\*/g, "").trim();
      if (!l || l.length < 2) return;
      const c = l.match(/^(nome(?: da crian[cç]a| do aluno| da aluna| para personalizar)?|aluno|aluna|crian[cç]a|filh[oa]|irm[aã]o?|tema|escola|s[eé]rie|ano|turma|respons[aá]vel|telefone|whats(?:app)?|endere[cç]o|entrega|cep)\s*[:=-]\s*(.+)$/i);
      if (c) {
        const k = norm(c[1]), v = c[2].trim();
        if (/^(nome|alun|crian|filh|irm)/.test(k)) { if (atual < 0 || criancas[atual].nome) nova(); criancas[atual].nome = v; }
        else if (k === "tema") crianca().tema = v;
        else if (k === "escola") crianca().escola = v;
        else if (/^(serie|ano|turma)/.test(k)) crianca().serie = v;
        else if (/^respons/.test(k)) campos.responsavel = v;
        else if (/^(telefone|whats)/.test(k)) campos.telefone = v;
        else if (k === "cep") campos.cep = digits(v).slice(0, 8);
        else if (/^endereco/.test(k)) { campos.endereco = (campos.endereco ? campos.endereco + ", " : "") + v; const m = v.match(/\b\d{5}-?\d{3}\b/); if (m && !campos.cep) campos.cep = digits(m[0]); }
        else if (k === "entrega") { const e = acharEntrega(v); if (e) campos.entrega = e; }
        return;
      }
      const e = acharEntrega(l);
      if (e && !acharProduto(l)) { campos.entrega = e; return; }
      let qtd = 1, desc = l, m;
      if ((m = l.match(/^(\d{1,3})\s*(?:x|un\.?|unid\.?|unidades?)?\s+(.+)$/i))) { qtd = +m[1]; desc = m[2]; }
      else if ((m = l.match(/^(.+?)\s*[-–:]?\s*(?:x\s*(\d{1,3})|\(?(\d{1,3})\s*(?:x|un\.?|unid\.?|unidades?)\)?)\s*$/i))) { desc = m[1]; qtd = +(m[2] || m[3]); }
      desc = desc.replace(/[\s:;,.-]+$/, "").trim();
      const pid = acharProduto(desc);
      const kid = Math.max(0, atual);
      if (!pid) { if (/etiqueta|kit|squeeze|chaveiro|tag|agenda|garrafa/i.test(desc)) itens.push({ produto: "", desc: desc.charAt(0).toUpperCase() + desc.slice(1), qtd: qtd || 1, preco: 0, feito: false, crianca: kid, revisar: true }); return; }
      const pr = produto(pid);
      itens.push({ produto: pid, desc: pr.nome, qtd: qtd || 1, preco: pr.preco, feito: false, crianca: kid });
    });
    return { criancas, campos, itens };
  }
  function acharEntrega(t) { const n = norm(t); if (/sedex|correio/.test(n)) return "sedex"; if (/uber|motoboy|moto/.test(n)) return "uber"; if (/retir/.test(n)) return "retirada"; return null; }

  function prazoArte(p) { return p.pagoEm ? maisDiasUteis(p.pagoEm, PRAZO_ARTE_DIAS) : null; }

  function msgCliente(p) {
    const t = totais(p), ent = entregaDe(p);
    const ks = criancasDe(p);
    const nome = (p.responsavel || "").split(" ")[0] || "tudo bem";
    const alunos = juntar(ks.map(k => k.nome).filter(Boolean)) || "seu filho(a)";

    const lista = (p.itens || []).map(i => `• ${i.qtd}x ${i.desc}${plural && ks[i.crianca || 0]?.nome ? " (" + ks[i.crianca || 0].nome + ")" : ""}${i.preco ? " – " + brl(i.qtd * i.preco) : ""}`).join("\n");

    switch (p.status) {
      case "arte": { const pz = prazoArte(p); return `Oi, ${nome}! Pagamento confirmado. Já estamos criando a${plural ? "s artes" : " arte"} de ${alunos}${temas.length ? ` (tema ${juntar(temas)})` : ""}. Enviamos para sua aprovação${pz ? ` até ${fmtDate(pz)}` : ` em até ${PRAZO_ARTE_DIAS} dias úteis`}.\n\nPapel & Magia`; }
      case "aprovacao": return `Oi, ${nome}! ${plural ? "As artes" : "A arte"} de ${alunos} ${plural ? "estão prontas" : "está pronta"}. Confira com carinho nome, tema e cores e responda "aprovado" para seguirmos com a produção.\n\nLembrando: depois da aprovação, a arte não pode mais ser modificada.\nPapel & Magia`;
      case "producao": return `Oi, ${nome}! Arte aprovada. Os produtos de ${alunos} já estão em produção. Avisamos assim que ficarem prontos.\n\nPapel & Magia`;

        return `Oi, ${nome}! Os produtos personalizados de ${alunos} estão prontos (pedido nº ${p.numero}).${falta} Já podem ser retirados aqui na loja, na ${LOJA}.\n\nPapel & Magia`;
      }
      case "entregue":
        if (ent.tipo === "sedex") return `Oi, ${nome}! O pedido de ${alunos} foi postado pelo Sedex.${ent.rastreio ? ` Código de rastreio: ${ent.rastreio}.` : ""}\n\nObrigado por escolher a Papel & Magia. Desejamos um ótimo início de ano letivo!`;
        return `Oi, ${nome}! Obrigado por escolher a Papel & Magia. Desejamos um ótimo início de ano letivo para ${alunos}!`;
      default: return `Oi, ${nome}! Segue o resumo do pedido nº ${p.numero} de ${alunos}${temas.length ? ` (tema ${juntar(temas)})` : ""}:\n\n${lista}${t.frete ? `\n• Frete (${ENT[ent.tipo].nome}) – ${brl(t.frete)}` : ""}\n\nTotal: ${brl(t.total)}${t.pago > 0 ? `\nJá pago: ${brl(t.pago)}\nFalta: ${brl(t.saldo)}` : ""}\nEntrega: ${ENT[ent.tipo].nome}\n\nPagamento por Pix (${PIX}) ou cartão de crédito (1x sem juros ou até 12x com juros da operadora). Como são produtos personalizados, o pedido é confirmado após o pagamento integral, e a arte fica pronta em até ${PRAZO_ARTE_DIAS} dias úteis.\n\nPapel & Magia`;
    }
  }

  // ---------- armazenamento ----------
  async function salvarPedido(p) {
    const body = JSON.parse(JSON.stringify(p)); delete body.id;
    if (db) await db.collection("pedidos").doc(p.id).set(body);
    else { mem.pedidos.set(p.id, { ...body, id: p.id }); syncMem(); }
  }
  async function atualizarPedido(id, patch) {
    if (db) await db.collection("pedidos").doc(id).update(patch);
    else { mem.pedidos.set(id, { ...mem.pedidos.get(id), ...patch }); syncMem(); }
  }
  async function apagarPedido(id) {
    if (db) await db.collection("pedidos").doc(id).delete();
    else { mem.pedidos.delete(id); syncMem(); }
  }
  async function salvarCliente(c) {
    const body = { nome: c.nome, telefone: c.telefone || "" };
    if (db) await db.collection("clientes").doc(c.id).set(body);
    else { mem.clientes.set(c.id, { ...body, id: c.id }); syncMem(); }
  }
  async function salvarPrecos(precos, sedex) {
    if (db) await db.doc("config/catalogo").set({ precos, sedex });
    else { state.precos = precos; state.sedex = sedex; render(); }
  }
  function syncMem() { state.pedidos = [...mem.pedidos.values()]; state.clientes = [...mem.clientes.values()]; render(); refreshPanel(); }

  async function iniciar() {
    let api = null;
    try { api = window.PMNuvem ? await window.PMNuvem.conectar() : null; } catch (e) { api = null; }
    if (!api) { state.modo = "memoria"; state.loaded = true; render(); return; }
    db = api; state.modo = "online";
    const timer = setTimeout(() => { if (!state.loaded) { state.erro = "Os pedidos ainda não carregaram. Verifique a conexão; a lista aparece assim que o servidor responder."; render(); } }, 10000);
    db.collection("pedidos").onSnapshot(snap => {
      state.pedidos = snap.docs.map(d => ({ ...d.data(), id: d.id }));
      if (!snap.metadata.fromCache) { state.loaded = true; state.erro = ""; clearTimeout(timer); }
      if (!painel || painel.tipo !== "editor") render(); refreshPanel();
    }, e => { clearTimeout(timer); state.loaded = true; state.erro = (navigator.onLine === false ? "Sem internet. Os pedidos aparecem assim que a conexão voltar." : "Não foi possível carregar os pedidos. Recarregue a página mais tarde."); render(); });
    db.collection("clientes").onSnapshot(snap => { state.clientes = snap.docs.map(d => ({ ...d.data(), id: d.id })); if (state.tab === "clientes") render(); }, () => {});
    db.doc("config/catalogo").onSnapshot(d => { state.precos = (d.exists && d.data().precos) || {}; state.sedex = (d.exists && d.data().sedex) || {}; if (state.tab === "catalogo") render(); }, () => {});
  }

  // ---------- render principal ----------
  const main = document.getElementById("main");
  const layer = document.getElementById("layer");

  function render() {
    ["pedidos", "clientes", "catalogo"].forEach(t => document.getElementById("tab-" + t).setAttribute("aria-selected", state.tab === t));
    let html = "";
    if (state.modo === "memoria") html += `<div class="notice warn">Modo de teste: o app não conseguiu ligar ao banco de dados, então nada do que você cadastrar aqui fica salvo. Verifique a internet e abra o app de novo.</div>`;
    if (state.erro) html += `<div class="notice warn">${esc(state.erro)}</div>`;
    html += state.tab === "pedidos" ? viewPedidos() : state.tab === "clientes" ? viewClientes() : viewCatalogo();
    main.innerHTML = html;
    bindMain();
  }

  function viewPedidos() {
    const ps = state.pedidos;
    const cont = Object.fromEntries(STATUS.map(s => [s.id, 0]));
    let vendido = 0, aReceber = 0;
    ps.forEach(p => { cont[p.status] = (cont[p.status] || 0) + 1; const t = totais(p); vendido += t.total; aReceber += t.saldo; });
    let h = `<section class="summary" aria-label="Resumo">`;
    STATUS.forEach(s => { h += `<button class="stat" data-filtro="${s.id}" aria-pressed="${state.filtro === s.id}" title="${s.nome}"><span class="lbl"><span class="dot d-${s.id}"></span>${s.curto}</span><span class="val num">${cont[s.id]}</span></button>`; });
    h += `<div class="stat money"><span class="lbl">Total vendido</span><span class="val num">${brl(vendido)}</span></div>`;
    h += `<div class="stat money"><span class="lbl">A receber</span><span class="val num">${brl(aReceber)}</span></div></section>`;

    const q = norm(state.busca), qd = digits(state.busca);
    const lista = ps.filter(p => (!state.filtro || p.status === state.filtro) && (!q || norm([p.numero, p.responsavel, ...criancasDe(p).flatMap(k => [k.nome, k.tema, k.escola, k.serie])].join(" ")).includes(q) || (qd.length >= 4 && digits(p.telefone).includes(qd))));
    lista.sort((a, b) => (b.numero || 0) - (a.numero || 0));

    h += `<div class="toolbar"><input type="search" id="busca" placeholder="Buscar por criança, responsável, tema ou nº" value="${esc(state.busca)}" aria-label="Buscar pedidos">`;
    if (state.filtro) h += `<button class="btn small" id="limpa-filtro">Mostrar todos</button>`;
    h += `<span class="count">${lista.length} ${lista.length === 1 ? "pedido" : "pedidos"}${state.filtro ? " · " + esc(ST[state.filtro].nome) : ""}</span></div>`;

    if (!state.loaded) return h + `<div class="list"><div class="empty">Carregando pedidos…</div></div>`;
    if (!ps.length) return h + `<div class="list"><div class="empty"><h3>Nenhum pedido ainda</h3><p>Cadastre o primeiro pedido. Dá para colar a mensagem que chegou pelo WhatsApp e o app reconhece os produtos do catálogo.</p><button class="btn primary" data-novo>+ Novo pedido</button></div></div>`;
    if (!lista.length) return h + `<div class="list"><div class="empty">Nenhum pedido com esse filtro.</div></div>`;
    h += `<div class="list">`;
    lista.forEach(p => {
      const t = totais(p), ks = criancasDe(p), ent = entregaDe(p);
      const n = (p.itens || []).length, feitos = (p.itens || []).filter(i => i.feito).length;
      const pz = p.status === "arte" ? prazoArte(p) : null;
      const temas = [...new Set(ks.map(k => k.tema).filter(Boolean))];
      h += `<button class="row" data-abrir="${esc(p.id)}">
        <span class="n num">nº ${esc(p.numero)}</span>
        <span class="who"><strong>${esc(juntar(ks.map(k => k.nome).filter(Boolean)) || "Sem nome")}${p.exemplo ? '<span class="tag">exemplo</span>' : ""}</strong><span>${esc(p.responsavel || "")}${p.telefone ? " · " + esc(fmtPhone(p.telefone)) : ""}${p.origem ? " · " + esc(ORI[p.origem]?.nome || "") : ""}</span></span>
        <span class="sch"><span>${temas.length ? "Tema " + esc(juntar(temas)) : "Tema a definir"}</span><br><span class="ship">${esc(ENT[ent.tipo]?.nome || "")}</span>${pz ? ` · <span class="prazo">Arte até ${fmtDate(pz)}</span>` : ""}</span>
        <span class="sep num" title="Itens produzidos"><span class="hint">${feitos}/${n} prontos</span><span class="prog"><i style="width:${n ? Math.round(feitos / n * 100) : 0}%"></i></span></span>
        <span class="tot r num"><strong>${brl(t.total)}</strong><br>${t.total > 0 ? (t.saldo > 0 ? `<span class="due">falta ${brl(t.saldo)}</span>` : `<span class="paid">pago</span>`) : `<span class="hint">sem itens</span>`}</span>
        <span class="pill s-${esc(p.status)}"><span class="dot d-${esc(p.status)}"></span>${esc(ST[p.status]?.curto || p.status)}</span>
      </button>`;
    });
    return h + `</div>`;
  }

  function viewClientes() {
    const mapa = new Map();
    state.clientes.forEach(c => mapa.set(c.id, { ...c, pedidos: [] }));
    state.pedidos.forEach(p => {
      const k = p.clienteId && mapa.has(p.clienteId) ? p.clienteId : "p:" + norm(p.responsavel) + digits(p.telefone);
      if (!mapa.has(k)) mapa.set(k, { id: k, nome: p.responsavel || "Sem nome", telefone: p.telefone, pedidos: [] });
      mapa.get(k).pedidos.push(p);
    });
    const lista = [...mapa.values()].sort((a, b) => (a.nome || "").localeCompare(b.nome || "", "pt-BR"));
    let h = `<div class="toolbar"><span class="count">${lista.length} ${lista.length === 1 ? "cliente" : "clientes"} · cadastrados junto com o pedido</span></div>`;
    if (!lista.length) return h + `<div class="list"><div class="empty"><h3>Nenhum cliente ainda</h3><p>Ao criar um pedido, o responsável e o WhatsApp ficam guardados aqui.</p></div></div>`;
    h += `<div class="clients">`;
    lista.forEach(c => {
      const total = c.pedidos.reduce((a, p) => a + totais(p).total, 0);
      const saldo = c.pedidos.reduce((a, p) => a + totais(p).saldo, 0);
      const wa = waNumber(c.telefone);
      const kids = c.pedidos.flatMap(p => criancasDe(p));
      h += `<article class="client"><h3>${esc(c.nome)}</h3><span class="phone num">${esc(fmtPhone(c.telefone) || "Sem telefone")}</span>`;
      if (kids.length) { h += `<ul>`; kids.forEach(k => { h += `<li>${esc(k.nome || "Criança")} <span class="hint">${k.tema ? "tema " + esc(k.tema) : ""}${k.serie ? " · " + esc(k.serie) : ""}</span></li>`; }); h += `</ul>`; }
      h += `<div class="foot"><span class="num">${c.pedidos.length} ${c.pedidos.length === 1 ? "pedido" : "pedidos"} · <span class="money-txt">${brl(total)}</span>${saldo > 0 ? ` · <span class="due">falta ${brl(saldo)}</span>` : ""}</span>
        <span class="btns">${wa ? `<a class="btn small" href="https://wa.me/${wa}" target="_blank" rel="noopener">WhatsApp</a>` : ""}<button class="btn small" data-ver-cliente="${esc(c.nome)}">Ver pedidos</button></span></div></article>`;
    });
    return h + `</div>`;
  }

  function viewCatalogo() {
    const cat = catalogo();
    let h = `<h2 class="page-title">Catálogo de Volta às Aulas 2027</h2><div class="rules">
      <div><h3>Formas de pagamento</h3><p>Pix: <span class="num">${esc(PIX)}</span><br>Cartão de crédito em 1x sem juros ou em até 12x com juros da operadora.</p></div>
      <div><h3>Confirmação</h3><p>Os pedidos só são confirmados mediante pagamento integral, pois se trata de um produto personalizado.</p></div>
      <div><h3>Arte</h3><p>Enviada em até ${PRAZO_ARTE_DIAS} dias úteis após o pagamento. Depois da aprovação, não é mais possível modificar.</p></div>
      <div><h3>Entrega</h3><p>Retirada na loja (${esc(LOJA)}), Sedex ou Uber Moto. O frete é somado ao pedido.</p></div>
      <div><h3>Onde chegam os pedidos</h3><p>WhatsApp, Instagram ou no balcão da loja.</p></div></div>`;
    h += `<div class="toolbar"><span class="count">Mesmos produtos e preços de 2026. Alterou algum? Salve aqui e ele vale para os próximos pedidos.</span></div>`;
    h += `<div class="cat"><table><thead><tr><th>Produto</th><th>Detalhe</th><th style="text-align:right">Preço</th></tr></thead><tbody>`;
    let g = "";
    cat.forEach(c => {
      if (c.grupo !== g) { g = c.grupo; h += `<tr><td colspan="3" class="grp">${esc(g)}</td></tr>`; }
      h += `<tr><td class="pname">${esc(c.nome)}${c.novo ? '<span class="novo">novo</span>' : ""}</td><td class="det">${esc(c.det)}</td><td style="text-align:right"><input id="preco-${c.id}" data-preco="${c.id}" inputmode="decimal" value="${moneyIn(c.preco)}" aria-label="Preço de ${esc(c.nome)}"></td></tr>`;
    });
    h += `</tbody></table></div>`;
    const sc = sedexCfg(), ufO = ufDoCep(sc.origemCep), mr = mediasReais(), nReal = Object.values(mr).reduce((a, m) => a + m.n, 0);
    h += `<h2 class="page-title">Frete do Sedex</h2>
      <div class="notice">O app calcula o Sedex sozinho quando o pedido tem o CEP do cliente: escolhe a embalagem pelos produtos e o valor pela distância até a loja. É uma <strong>estimativa</strong> feita com esta tabela, não uma consulta aos Correios. Os valores abaixo são um ponto de partida: troque pelos valores que vocês pagam de verdade. Para o valor exato, simule no <a href="${LINK_SUPERAPP}" target="_blank" rel="noopener">app dos Correios</a>.<br><br><strong>Para a tabela ficar igual ao app dos Correios:</strong> em cada pedido de Sedex, anote o valor que o app dos Correios cobrou no campo "Valor pago no app dos Correios". A média real aparece embaixo de cada valor da tabela, e o botão "Usar médias reais" copia essas médias para a tabela.</div>
      <div class="cat"><table><thead><tr><th>Destino</th><th style="text-align:right">${esc(EMBALAGENS.envelope.nome)}<br><span class="det" style="text-transform:none;letter-spacing:0">só etiquetas</span></th><th style="text-align:right">${esc(EMBALAGENS.caixa.nome)}<br><span class="det" style="text-transform:none;letter-spacing:0">demais produtos</span></th></tr></thead><tbody>
      ${FAIXAS.map(f => `<tr><td><span class="pname">${esc(f.nome)}</span><br><span class="det">${esc(f.det)}</span></td>${["envelope", "caixa"].map(e => { const m = mr[e + "." + f.id]; return `<td style="text-align:right"><input id="sedex-${e}-${f.id}" data-sedex="${e}.${f.id}" inputmode="decimal" value="${moneyIn(sc[e][f.id])}" aria-label="Sedex ${esc(EMBALAGENS[e].nome)}: ${esc(f.nome)}">${m ? `<br><span class="det">real: ${brl(m.media)} (${m.n} ${m.n === 1 ? "envio" : "envios"})</span>` : ""}</td>`; }).join("")}</tr>`).join("")}
      <tr><td><span class="pname">CEP da loja</span><br><span class="det">Origem dos envios${ufO ? " · " + ufO : ""} (Rua Tabor, 456)</span></td><td colspan="2" style="text-align:right"><input id="sedex-origem" inputmode="numeric" value="${esc(fmtCep(sc.origemCep))}" placeholder="00000-000" aria-label="CEP da loja" style="color:var(--fg)"></td></tr>
      </tbody></table></div>`;
    h += `<div class="btns"><button class="btn primary" id="salvar-precos">Salvar preços e frete</button>${nReal ? `<button class="btn blue" id="usar-medias">Usar médias reais (${nReal} ${nReal === 1 ? "envio" : "envios"})</button>` : ""}<button class="btn" id="restaurar-precos">Voltar aos preços originais</button></div>`;
    return h;
  }

  function bindMain() {
    main.querySelectorAll("[data-filtro]").forEach(b => b.onclick = () => { state.filtro = state.filtro === b.dataset.filtro ? null : b.dataset.filtro; render(); });
    const lf = document.getElementById("limpa-filtro"); if (lf) lf.onclick = () => { state.filtro = null; render(); };
    const busca = document.getElementById("busca");
    if (busca) busca.oninput = () => { state.busca = busca.value; const pos = busca.selectionStart; render(); const b2 = document.getElementById("busca"); b2.focus(); b2.setSelectionRange(pos, pos); };
    main.querySelectorAll("[data-abrir]").forEach(b => b.onclick = () => abrirDetalhe(b.dataset.abrir));
    main.querySelectorAll("[data-novo]").forEach(b => b.onclick = () => abrirEditor(null));
    main.querySelectorAll("[data-ver-cliente]").forEach(b => b.onclick = () => { state.tab = "pedidos"; state.filtro = null; state.busca = b.dataset.verCliente; render(); });
    const sp = document.getElementById("salvar-precos");
    if (sp) sp.onclick = () => {
      const precos = {};
      main.querySelectorAll("[data-preco]").forEach(inp => { const v = parseMoney(inp.value); const base = CATALOGO_PADRAO.find(c => c.id === inp.dataset.preco).preco; if (v !== base) precos[inp.dataset.preco] = v; });
      const sedex = { origemCep: digits(document.getElementById("sedex-origem").value).slice(0, 8) };
      sedex.envelope = {}; sedex.caixa = {};
      main.querySelectorAll("[data-sedex]").forEach(inp => { const [e, f] = inp.dataset.sedex.split("."); sedex[e][f] = parseMoney(inp.value); });
      if (sedex.origemCep && sedex.origemCep.length !== 8) { toast("O CEP da loja precisa ter 8 números."); return; }
      run(() => salvarPrecos(precos, sedex), "Preços e frete salvos").catch(() => {});
    };
    const um = document.getElementById("usar-medias");
    if (um) um.onclick = () => { const mr = mediasReais(); let n = 0; Object.entries(mr).forEach(([k, m]) => { const inp = main.querySelector(`[data-sedex="${k}"]`); if (inp) { inp.value = moneyIn(m.media); n++; } }); toast(`${n} ${n === 1 ? "valor atualizado" : "valores atualizados"}. Clique em Salvar para guardar.`); };
    const rp = document.getElementById("restaurar-precos");
    if (rp) rp.onclick = () => run(() => salvarPrecos({}, state.sedex || {}), "Preços originais restaurados").then(render).catch(() => {});
  }

  // ---------- painéis ----------
  let painel = null;
  function fechar() { const eraEditor = painel && painel.tipo === "editor"; painel = null; layer.innerHTML = ""; if (eraEditor) render(); }
  function refreshPanel() { if (painel && painel.tipo === "detalhe") abrirDetalhe(painel.id, true); }
  function toast(t) { document.querySelectorAll(".toast").forEach(x => x.remove()); const el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2400); }
  function shell(titulo, body, footer) {
    layer.innerHTML = `<div class="overlay" id="ov"><div class="panel" role="dialog" aria-modal="true" aria-label="${esc(titulo)}"><header><h2>${esc(titulo)}</h2><button class="x" id="fechar" aria-label="Fechar">×</button></header><div class="body">${body}</div>${footer ? `<footer>${footer}</footer>` : ""}</div></div>`;
    document.getElementById("fechar").onclick = fechar;
    document.getElementById("ov").onclick = e => { if (e.target.id === "ov") fechar(); };
  }
  document.addEventListener("keydown", e => { if (e.key === "Escape" && painel) fechar(); });

  async function run(fn, ok) {
    try { await fn(); if (ok) toast(ok); }
    catch (e) { toast(e && e.code === "invalid_argument" ? "Você não tem permissão para alterar os dados." : e && e.code === "quota_exceeded" ? "O espaço do app acabou. Exclua pedidos antigos." : "Não foi possível salvar. Tente de novo."); throw e; }
  }

  function abrirDetalhe(id, keepScroll) {
    const p = state.pedidos.find(x => x.id === id);
    if (!p) { if (painel && painel.tipo === "detalhe") fechar(); return; }
    const scroll = keepScroll ? (layer.querySelector(".panel")?.scrollTop || 0) : 0;
    painel = { tipo: "detalhe", id };
    const t = totais(p), ks = criancasDe(p), ent = entregaDe(p);
    const itens = p.itens || [];
    const feitos = itens.filter(i => i.feito).length;
    const wa = waNumber(p.telefone);
    const msg = msgCliente(p);
    const pz = prazoArte(p);
    let aviso = "";
    if (p.status === "recebido" && t.saldo === 0 && t.total > 0) aviso = "Pagamento completo. Passe para Arte para começar.";
    else if (p.status === "recebido") aviso = "O pedido só é confirmado com o pagamento integral.";
    else if (p.status === "arte" && pz) aviso = `Prazo para enviar a arte: ${fmtDate(pz)} (${PRAZO_ARTE_DIAS} dias úteis após o pagamento).`;
    else if (p.status === "aprovacao") aviso = "Arte enviada. Quando o cliente aprovar, passe para Produção.";
    else if (p.status === "producao" && feitos === itens.length && itens.length) aviso = "Todos os itens estão prontos. Marque como Pronto e avise o cliente.";
    let b = `<section class="sec"><h3>Etapa</h3><div class="statusbar">${STATUS.map(s => `<button class="s-${s.id}" data-status="${s.id}" aria-pressed="${p.status === s.id}" title="${s.nome}"><span class="dot d-${s.id}"></span>${s.curto}</button>`).join("")}</div>
      ${aviso ? `<span class="hint">${esc(aviso)}</span>` : ""}</section>`;
    b += `<section class="sec"><h3>${ks.length > 1 ? "Crianças" : "Personalização"}</h3>`;
    ks.forEach(k => { b += `<dl class="kv"><dt>Nome</dt><dd class="kname">${esc(k.nome || "—")}</dd><dt>Tema</dt><dd>${esc(k.tema || "A definir")}</dd>${k.escola || k.serie ? `<dt>Escola</dt><dd>${esc(k.escola || "—")}${k.serie ? " · " + esc(k.serie) : ""}</dd>` : ""}</dl>`; });
    b += `</section>`;
    b += `<section class="sec"><h3>Cliente e entrega</h3><dl class="kv">
      <dt>Responsável</dt><dd>${esc(p.responsavel || "—")}</dd>
      <dt>WhatsApp</dt><dd class="num">${esc(fmtPhone(p.telefone) || "—")}</dd>
      <dt>Pedido feito por</dt><dd>${esc(ORI[p.origem]?.nome || "Não informado")}</dd>
      <dt>Entrega</dt><dd>${esc(ENT[ent.tipo].nome)}${t.frete ? " · frete " + brl(t.frete) : ""}</dd>
      ${ent.tipo !== "retirada" ? `<dt>Endereço</dt><dd>${esc(ent.endereco || "Não informado")}${ent.cep ? " · CEP " + esc(fmtCep(ent.cep)) : ""}</dd>` : ""}
      ${ent.tipo === "sedex" ? `<dt>Rastreio</dt><dd>${esc(ent.rastreio || "Ainda não postado")}</dd>${ent.freteReal ? `<dt>Pago nos Correios</dt><dd class="money-txt">${brl(ent.freteReal)}</dd>` : ""}` : ""}
      <dt>Pedido em</dt><dd>${esc(fmtDate(p.criadoEm))}</dd>
      ${p.pagoEm ? `<dt>Pago em</dt><dd>${esc(fmtDate(p.pagoEm))}</dd>` : ""}
      ${p.obs ? `<dt>Observações</dt><dd>${esc(p.obs)}</dd>` : ""}</dl></section>`;
    if (ent.tipo === "sedex") b += `<section class="sec"><h3>Dados para o app dos Correios</h3><div class="msg" id="msg-correios">${esc(textoCorreios(p))}</div>
      <div class="btns"><button class="btn" id="copiar-correios">Copiar dados</button><a class="btn" href="${LINK_SUPERAPP}" target="_blank" rel="noopener">Abrir app dos Correios</a></div>
      <span class="hint">Depois de comprar a etiqueta, anote em "Editar pedido" o valor pago e o código de rastreio.</span></section>`;
    b += `<section class="sec"><h3>Produção · ${feitos} de ${itens.length} itens prontos</h3>`;
    if (itens.length) b += `<div class="check">${itens.map((i, k) => `<label class="${i.feito ? "done" : ""}"><input type="checkbox" id="feito-${k}" data-feito="${k}" ${i.feito ? "checked" : ""}><span class="num hint">${esc(i.qtd)}×</span><span><span class="desc">${esc(i.desc)}</span>${ks.length > 1 ? `<span class="who-kid">${esc(ks[i.crianca || 0]?.nome || "")}</span>` : ""}</span><span class="num money-txt">${i.preco ? brl(i.qtd * i.preco) : "sem preço"}</span></label>`).join("")}</div>`;
    else b += `<p class="hint">Nenhum item no pedido.</p>`;
    b += `</section>`;
    b += `<section class="sec"><h3>Valores</h3><div class="totals num">
      <div><span>Produtos</span><span>${brl(t.sub)}</span></div>
      ${t.frete ? `<div><span>Frete (${esc(ENT[ent.tipo].nome)})</span><span>${brl(t.frete)}</span></div>` : ""}
      ${p.desconto ? `<div><span>Desconto</span><span>− ${brl(p.desconto)}</span></div>` : ""}
      <div class="big"><span>Total</span><span>${brl(t.total)}</span></div>
      <div><span>Pago${p.formaPagamento ? " (" + esc(p.formaPagamento) + ")" : ""}</span><span>${brl(t.pago)}</span></div>
      <div>${t.saldo > 0 ? `<span class="due">Falta pagar</span><span class="due">${brl(t.saldo)}</span>` : `<span class="paid">Quitado</span><span></span>`}</div></div>
      ${t.saldo > 0 ? `<div class="btns" style="justify-content:flex-end"><button class="btn small" id="quitar-pix">Pago no Pix</button><button class="btn small" id="quitar-cartao">Pago no cartão</button></div>` : ""}</section>`;
    b += `<section class="sec"><h3>Mensagem para o cliente</h3><span class="hint">Etapa: ${esc(ST[p.status]?.nome || "")}</span><div class="msg" id="msg">${esc(msg)}</div>
      <div class="btns"><button class="btn" id="copiar">Copiar mensagem</button>${wa ? `<a class="btn primary" href="https://wa.me/${wa}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Abrir no WhatsApp</a>` : `<span class="hint">Cadastre o WhatsApp do cliente para abrir a conversa direto.</span>`}</div></section>`;
    if (p.textoOriginal) b += `<section class="sec"><h3>Mensagem original do cliente</h3><div class="msg">${esc(p.textoOriginal)}</div></section>`;
    const f = `<button class="btn danger" id="apagar">Excluir pedido</button><span class="spacer"></span><button class="btn" id="editar">Editar pedido</button>`;
    shell(`Pedido nº ${p.numero}`, b, f);
    if (scroll) layer.querySelector(".panel").scrollTop = scroll;

    layer.querySelectorAll("[data-status]").forEach(btn => btn.onclick = () => {
      const patch = { status: btn.dataset.status };
      if (patch.status !== "recebido" && !p.pagoEm) patch.pagoEm = new Date().toISOString();
      run(() => atualizarPedido(p.id, patch), ST[patch.status].nome).catch(() => {});
    });
    layer.querySelectorAll("[data-feito]").forEach(cb => cb.onchange = () => {
      const novos = itens.map((i, k) => k === +cb.dataset.feito ? { ...i, feito: cb.checked } : { ...i });
      const patch = { itens: novos };
      if (cb.checked && p.status === "aprovacao") patch.status = "producao";
      run(() => atualizarPedido(p.id, patch)).catch(() => {});
    });
    const quitar = forma => () => {
      const patch = { pago: t.total, formaPagamento: forma };
      if (p.status === "recebido") { patch.status = "arte"; patch.pagoEm = new Date().toISOString(); }
      run(() => atualizarPedido(p.id, patch), p.status === "recebido" ? "Pagamento registrado. Arte em criação." : "Pagamento registrado").catch(() => {});
    };
    const qp = document.getElementById("quitar-pix"); if (qp) qp.onclick = quitar("Pix");
    const qc = document.getElementById("quitar-cartao"); if (qc) qc.onclick = quitar("Cartão de crédito");
    document.getElementById("copiar").onclick = () => {
      const sel = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById("msg")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Texto selecionado. Use Copiar do seu aparelho."); };
      try { navigator.clipboard.writeText(msg).then(() => toast("Mensagem copiada"), sel); } catch (e) { sel(); }
    };
    const cc = document.getElementById("copiar-correios");
    if (cc) cc.onclick = () => {
      const txt = textoCorreios(p);
      const sel = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById("msg-correios")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Texto selecionado. Use Copiar do seu aparelho."); };
      try { navigator.clipboard.writeText(txt).then(() => toast("Dados copiados"), sel); } catch (e) { sel(); }
    };
    document.getElementById("editar").onclick = () => abrirEditor(p);
    const del = document.getElementById("apagar");
    del.onclick = () => {
      if (!del.classList.contains("armed")) { del.classList.add("armed"); del.textContent = "Confirmar exclusão"; setTimeout(() => { if (del.isConnected) { del.classList.remove("armed"); del.textContent = "Excluir pedido"; } }, 4000); return; }
      run(() => apagarPedido(p.id), "Pedido excluído").then(fechar).catch(() => {});
    };
  }

  function abrirEditor(orig) {
    const r = orig ? JSON.parse(JSON.stringify(orig)) : { id: newId(), numero: null, status: "recebido", origem: "whatsapp", responsavel: "", telefone: "", obs: "", itens: [], desconto: 0, pago: 0, formaPagamento: "", textoOriginal: "", criadoEm: new Date().toISOString() };
    r.criancas = JSON.parse(JSON.stringify(criancasDe(r)));
    r.entrega = entregaDe(r);
    if (orig && r.entrega.frete > 0 && r.entrega.freteManual === undefined) r.entrega.freteManual = true;
    painel = { tipo: "editor", r };
    const cat = catalogo();
    const escolas = [...new Set(state.pedidos.flatMap(p => criancasDe(p).map(k => k.escola)).filter(Boolean))];
    const resp = [...new Set([...state.clientes.map(c => c.nome), ...state.pedidos.map(p => p.responsavel)].filter(Boolean))];
    const opts = sel => `<option value="">Outro (digite abaixo)</option>` + [...new Set(cat.map(c => c.grupo))].map(g => `<optgroup label="${esc(g)}">${cat.filter(c => c.grupo === g).map(c => `<option value="${c.id}" ${sel === c.id ? "selected" : ""}>${esc(c.nome)} · ${brl(c.preco)}</option>`).join("")}</optgroup>`).join("");
    const b = `
      <section class="paste"><label class="f" for="cola">Colar mensagem do WhatsApp ou Instagram<textarea id="cola" placeholder="Cole aqui a mensagem do cliente. Exemplo:&#10;Nome: Helena&#10;Tema: Jardim encantado&#10;1 Kit M glossy&#10;Squeeze com bico&#10;Nome: Davi&#10;Tema: Dinossauros&#10;2 chaveiros tabuada&#10;Entrega por Sedex"></textarea></label>
        <div class="row-btns"><button class="btn primary small" id="ler">Ler mensagem</button><span class="hint">O app reconhece os produtos do catálogo, as linhas "Nome:", "Tema:", "Escola:", "Série:", "Endereço:" e a forma de entrega. Cada "Nome:" vira uma criança. Confira antes de salvar.</span></div></section>
      <section class="sec"><h3>Cliente</h3>
        <div class="seg" role="group" aria-label="Por onde chegou o pedido">${ORIGEM.map(o => `<button type="button" data-ori="${o.id}" aria-pressed="${(r.origem || "") === o.id}">${o.nome}</button>`).join("")}</div>
        <div class="grid2">
        <label class="f">Responsável<input id="e-resp" list="dl-resp" value="${esc(r.responsavel)}" autocomplete="off"></label>
        <label class="f">WhatsApp / telefone<input id="e-tel" inputmode="tel" value="${esc(fmtPhone(r.telefone))}" placeholder="(11) 98765-4321"></label></div>
        <datalist id="dl-resp">${resp.map(n => `<option value="${esc(n)}">`).join("")}</datalist></section>
      <section class="sec"><h3>Crianças</h3><div id="kids" class="sec"></div>
        <div class="btns"><button class="btn small" id="add-kid">+ Adicionar irmão ou irmã</button></div>
        <datalist id="dl-escola">${escolas.map(n => `<option value="${esc(n)}">`).join("")}</datalist></section>
      <section class="sec"><h3>Produtos</h3><div class="items-wrap"><table class="items"><thead><tr><th class="prod">Produto</th><th class="q">Qtd</th><th class="p">Preço un.</th><th class="t">Subtotal</th><th class="del"></th></tr></thead><tbody id="tb"></tbody></table></div>
        <div class="btns"><button class="btn small" id="add-item">+ Adicionar produto</button></div></section>
      <section class="sec"><h3>Entrega</h3><div class="seg" id="seg-ent">${ENTREGA.map(e => `<button type="button" data-ent="${e.id}" aria-pressed="${r.entrega.tipo === e.id}">${e.nome}</button>`).join("")}</div>
        <div class="grid2" id="ent-campos"></div></section>
      <section class="sec"><h3>Pagamento</h3><div class="grid2">
        <label class="f">Desconto (R$)<input id="e-desc" inputmode="decimal" value="${moneyIn(r.desconto)}" placeholder="0,00"></label>
        <label class="f">Valor já pago (R$)<input id="e-pago" inputmode="decimal" value="${moneyIn(r.pago)}" placeholder="0,00"></label>
        <label class="f">Forma de pagamento<select id="e-forma">${["", "Pix", "Cartão de crédito"].map(o => `<option ${r.formaPagamento === o ? "selected" : ""} value="${o}">${o || "Não informado"}</option>`).join("")}</select></label>
        <label class="f">Etapa<select id="e-status">${STATUS.map(s => `<option value="${s.id}" ${r.status === s.id ? "selected" : ""}>${s.nome}</option>`).join("")}</select></label>
        <label class="f full">Observações<input id="e-obs" value="${esc(r.obs)}" placeholder="Ex.: enviar a arte de manhã"></label></div>
        <div class="totals num" id="tt"></div></section>`;
    const f = `<button class="btn" id="cancelar">Cancelar</button><button class="btn primary" id="salvar">${orig ? "Salvar alterações" : "Criar pedido"}</button>`;
    shell(orig ? `Editar pedido nº ${orig.numero}` : "Novo pedido", b, f);

    const tb = document.getElementById("tb");
    const kidsEl = document.getElementById("kids");
    function lerCampos() {
      kidsEl.querySelectorAll("[data-kid]").forEach(el => { const k = r.criancas[+el.dataset.kid]; ["nome", "tema", "escola", "serie"].forEach(f => k[f] = el.querySelector(`[data-f="${f}"]`).value.trim()); });
      tb.querySelectorAll("tr[data-k]").forEach(tr => { const i = r.itens[+tr.dataset.k]; i.qtd = Math.max(0, parseInt(tr.querySelector(".q-in").value, 10) || 0); i.desc = tr.querySelector(".d-in").value; i.preco = parseMoney(tr.querySelector(".p-in").value); const ks = tr.querySelector(".k-in"); if (ks) i.crianca = +ks.value; });
      const fr = document.getElementById("e-frete"); r.entrega.frete = fr ? parseMoney(fr.value) : 0;
      const en = document.getElementById("e-end"); if (en) r.entrega.endereco = en.value.trim();
      const ce = document.getElementById("e-cep"); if (ce) r.entrega.cep = digits(ce.value).slice(0, 8);
      const ra = document.getElementById("e-rastreio"); if (ra) r.entrega.rastreio = ra.value.trim();
      const re = document.getElementById("e-real"); if (re) r.entrega.freteReal = parseMoney(re.value);
      r.desconto = parseMoney(document.getElementById("e-desc").value);
      r.pago = parseMoney(document.getElementById("e-pago").value);
    }
    function totaisEd() {
      lerCampos();
      if (r.entrega.tipo === "sedex") freteAutomatico();
      tb.querySelectorAll("tr[data-k]").forEach(tr => { const i = r.itens[+tr.dataset.k]; tr.querySelector(".t").textContent = brl(i.qtd * i.preco); });
      const t = totais(r);
      document.getElementById("tt").innerHTML = `<div><span>Produtos</span><span>${brl(t.sub)}</span></div>${t.frete ? `<div><span>Frete</span><span>${brl(t.frete)}</span></div>` : ""}<div class="big"><span>Total</span><span>${brl(t.total)}</span></div><div><span>${t.saldo > 0 ? "Falta pagar" : "Saldo"}</span><span class="${t.saldo > 0 ? "due" : "paid"}">${brl(t.saldo)}</span></div>`;
    }
    function desenharKids() {
      kidsEl.innerHTML = r.criancas.map((k, n) => `<div class="kid" data-kid="${n}"><div class="kid-h"><strong>${r.criancas.length > 1 ? `Criança ${n + 1}` : "Personalização"}</strong>${r.criancas.length > 1 ? `<button class="btn small danger" data-rmkid="${n}">Remover</button>` : ""}</div><div class="grid2">
        <label class="f">Nome para personalizar<input id="k-nome-${n}" data-f="nome" value="${esc(k.nome)}"></label>
        <label class="f">Tema<input id="k-tema-${n}" data-f="tema" value="${esc(k.tema)}" placeholder="Ex.: Dinossauros, Frozen"></label>
        <label class="f">Escola<input id="k-escola-${n}" data-f="escola" list="dl-escola" value="${esc(k.escola)}"></label>
        <label class="f">Série / ano<input id="k-serie-${n}" data-f="serie" value="${esc(k.serie)}" placeholder="3º ano"></label></div></div>`).join("");
      kidsEl.querySelectorAll("input").forEach(inp => inp.onchange = () => { if (r.criancas.length > 1) { lerCampos(); linhas(); } });
      kidsEl.querySelectorAll("[data-rmkid]").forEach(btn => btn.onclick = () => {
        lerCampos(); const n = +btn.dataset.rmkid; r.criancas.splice(n, 1);
        r.itens.forEach(i => { if ((i.crianca || 0) === n) i.crianca = 0; else if ((i.crianca || 0) > n) i.crianca--; });
        desenharKids(); linhas();
      });
    }
    function desenharEntrega() {
      const e = r.entrega;
      document.querySelectorAll("[data-ent]").forEach(btn => btn.setAttribute("aria-pressed", btn.dataset.ent === e.tipo));
      document.getElementById("ent-campos").innerHTML = e.tipo === "retirada" ? `<span class="hint full">O cliente retira na loja. Sem frete.</span>` :
        `<label class="f full">Endereço de entrega<input id="e-end" value="${esc(e.endereco)}" placeholder="Rua, número, bairro, cidade"></label>
         ${e.tipo === "sedex" ? `<label class="f">CEP do cliente<input id="e-cep" inputmode="numeric" value="${esc(fmtCep(e.cep))}" placeholder="00000-000"></label><div class="full" id="sedex-est" aria-live="polite"></div>` : ""}
         <label class="f">Frete (R$)<input id="e-frete" inputmode="decimal" value="${moneyIn(e.frete)}" placeholder="0,00"></label>
         ${e.tipo === "sedex" ? `<label class="f">Código de rastreio<input id="e-rastreio" value="${esc(e.rastreio)}" placeholder="Preencha depois de postar"></label>
         <label class="f">Valor pago no app dos Correios (R$)<input id="e-real" inputmode="decimal" value="${moneyIn(e.freteReal)}" placeholder="Depois de comprar a etiqueta"></label>` : ""}`;
      ["e-end", "e-rastreio"].forEach(id => { const el = document.getElementById(id); if (el) el.oninput = totaisEd; });
      const fr = document.getElementById("e-frete");
      if (fr) fr.oninput = () => { if (r.entrega.tipo === "sedex") r.entrega.freteManual = true; totaisEd(); };
      const ce = document.getElementById("e-cep");
      if (ce) ce.oninput = totaisEd;
      totaisEd();
    }
    // Calcula o Sedex a cada mudança de CEP ou de produtos, a não ser que o frete tenha sido digitado à mão
    function freteAutomatico() {
      const box = document.getElementById("sedex-est"); if (!box) return;
      const cep = digits(r.entrega.cep);
      const fr = document.getElementById("e-frete");
      if (cep.length < 8) { box.innerHTML = `<span class="hint">Digite o CEP do cliente e o app calcula o Sedex.</span>`; return; }
      const est = calcularSedex(cep, r.itens);
      if (!est) { box.innerHTML = `<span class="due">CEP não reconhecido. Confira os números.</span>`; return; }
      if (!est.faixa) { box.innerHTML = `<span class="hint">Informe o CEP da loja na aba Catálogo para calcular o Sedex.</span>`; return; }
      if (!est.emb) { box.innerHTML = `<span class="hint">Adicione os produtos para o app escolher a embalagem e calcular o Sedex.</span>`; return; }
      const faixa = FAIXAS.find(f => f.id === est.faixa);
      if (!r.entrega.freteManual) { r.entrega.frete = est.valor; fr.value = moneyIn(est.valor); }
      const igual = Math.abs((r.entrega.frete || 0) - est.valor) < 0.005;
      box.innerHTML = `<div class="notice" style="display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap"><span>Sedex estimado: <strong class="money-txt">${brl(est.valor)}</strong> · ${esc(EMBALAGENS[est.emb].nome)} · ${esc(est.uf)}, ${esc(faixa.curto)}${r.entrega.freteManual && !igual ? `. <strong>O frete foi digitado à mão.</strong>` : ""}</span>${r.entrega.freteManual && !igual ? `<button class="btn small blue" type="button" id="usar-est">Usar o cálculo</button>` : ""}<a class="btn small" href="${LINK_SUPERAPP}" target="_blank" rel="noopener">Conferir no app dos Correios</a></div>`;
      const u = document.getElementById("usar-est");
      if (u) u.onclick = () => { r.entrega.freteManual = false; totaisEd(); };
    }
    function linhas() {
      const multi = r.criancas.length > 1;
      const kopts = sel => r.criancas.map((k, n) => `<option value="${n}" ${sel === n ? "selected" : ""}>${esc(k.nome || "Criança " + (n + 1))}</option>`).join("");
      tb.innerHTML = r.itens.map((i, k) => `<tr data-k="${k}"><td><select id="s-${k}" data-prod="${k}" aria-label="Produto">${opts(i.produto)}</select><input class="d-in" id="d-${k}" value="${esc(i.desc)}" aria-label="Descrição"${i.produto ? ' hidden' : ""} placeholder="Descreva o item">${multi ? `<select class="k-in" id="kk-${k}" aria-label="Para qual criança">${kopts(i.crianca || 0)}</select>` : ""}${i.revisar ? `<span class="due">Confira: "${esc(i.desc)}"</span>` : ""}</td><td><input class="q-in num" id="q-${k}" inputmode="numeric" value="${esc(i.qtd)}" aria-label="Quantidade"></td><td><input class="p-in num" id="p-${k}" inputmode="decimal" value="${moneyIn(i.preco)}" placeholder="0,00" aria-label="Preço unitário"></td><td class="t num"></td><td><button class="x" data-rm="${k}" aria-label="Remover produto">×</button></td></tr>`).join("") || `<tr><td colspan="5" class="hint" style="padding:10px 6px">Cole a mensagem acima ou adicione produtos um a um.</td></tr>`;
      tb.querySelectorAll("input").forEach(inp => inp.oninput = totaisEd);
      tb.querySelectorAll("[data-prod]").forEach(sel => sel.onchange = () => {
        lerCampos();
        const i = r.itens[+sel.dataset.prod]; const pr = produto(sel.value);
        i.produto = sel.value; delete i.revisar;
        if (pr) { i.desc = pr.nome; i.preco = pr.preco; }
        linhas();
      });
      tb.querySelectorAll("[data-rm]").forEach(btn => btn.onclick = () => { lerCampos(); r.itens.splice(+btn.dataset.rm, 1); linhas(); });
      totaisEd();
    }
    desenharKids(); linhas(); desenharEntrega();
    ["e-desc", "e-pago"].forEach(id => document.getElementById(id).oninput = totaisEd);
    document.querySelectorAll("[data-ori]").forEach(btn => btn.onclick = () => { r.origem = btn.dataset.ori; document.querySelectorAll("[data-ori]").forEach(b2 => b2.setAttribute("aria-pressed", b2 === btn)); });
    document.querySelectorAll("[data-ent]").forEach(btn => btn.onclick = () => { lerCampos(); if (btn.dataset.ent !== r.entrega.tipo) r.entrega.freteManual = false; r.entrega.tipo = btn.dataset.ent; desenharEntrega(); });
    document.getElementById("e-resp").onchange = e => {
      const c = state.clientes.find(c => c.nome === e.target.value) || state.pedidos.find(p => p.responsavel === e.target.value);
      const tel = document.getElementById("e-tel"); if (c && !tel.value) tel.value = fmtPhone(c.telefone);
    };
    document.getElementById("add-kid").onclick = () => { lerCampos(); r.criancas.push({ nome: "", tema: "", escola: "", serie: "" }); desenharKids(); linhas(); document.getElementById("k-nome-" + (r.criancas.length - 1)).focus(); };
    document.getElementById("add-item").onclick = () => { lerCampos(); const pr = cat[0]; r.itens.push({ produto: pr.id, desc: pr.nome, qtd: 1, preco: pr.preco, feito: false, crianca: 0 }); linhas(); document.getElementById("s-" + (r.itens.length - 1)).focus(); };
    document.getElementById("ler").onclick = () => {
      const txt = document.getElementById("cola").value;
      const { criancas, campos, itens } = lerMensagem(txt);
      if (!itens.length && !criancas.length && !Object.keys(campos).length) { toast("Não encontrei produtos do catálogo nessa mensagem."); return; }
      lerCampos();
      // As crianças lidas preenchem as vagas vazias e depois viram novas crianças
      const mapa = criancas.map(k => {
        let n = r.criancas.findIndex(c => k.nome && norm(c.nome) === norm(k.nome));
        if (n < 0) n = r.criancas.findIndex(c => !c.nome && !c.tema);
        if (n < 0) { r.criancas.push({ nome: "", tema: "", escola: "", serie: "" }); n = r.criancas.length - 1; }
        const c = r.criancas[n]; ["nome", "tema", "escola", "serie"].forEach(f => { if (k[f] && !c[f]) c[f] = k[f]; });
        return n;
      });
      itens.forEach(i => { i.crianca = mapa.length ? mapa[i.crianca] ?? 0 : 0; });
      const setIf = (id, v) => { const el = document.getElementById(id); if (v && !el.value.trim()) el.value = v; };
      setIf("e-resp", campos.responsavel); setIf("e-tel", campos.telefone && fmtPhone(campos.telefone));
      if (campos.entrega) r.entrega.tipo = campos.entrega;
      if (campos.endereco && !r.entrega.endereco) r.entrega.endereco = campos.endereco;
      if (campos.cep && !r.entrega.cep) r.entrega.cep = campos.cep;
      r.itens.push(...itens); r.textoOriginal = (r.textoOriginal ? r.textoOriginal + "\n\n" : "") + txt.trim();
      document.getElementById("cola").value = "";
      desenharKids(); linhas(); desenharEntrega();
      const rev = itens.filter(i => i.revisar).length;
      toast(`${itens.length} ${itens.length === 1 ? "produto lido" : "produtos lidos"}${criancas.length > 1 ? ` para ${criancas.length} crianças` : ""}${rev ? `, ${rev} para conferir` : ""}`);
    };
    document.getElementById("cancelar").onclick = () => orig ? abrirDetalhe(orig.id) : fechar();
    document.getElementById("salvar").onclick = async () => {
      lerCampos();
      const v = id => document.getElementById(id).value.trim();
      r.responsavel = v("e-resp"); r.telefone = digits(v("e-tel")); r.formaPagamento = v("e-forma"); r.obs = v("e-obs");
      const novoStatus = v("e-status");
      if (novoStatus !== "recebido" && !r.pagoEm) r.pagoEm = new Date().toISOString();
      r.status = novoStatus;
      r.criancas = r.criancas.filter((k, n) => n === 0 || k.nome || k.tema);
      r.itens = r.itens.filter(i => i.desc.trim()).map(i => { const c = { ...i }; delete c.revisar; if ((c.crianca || 0) >= r.criancas.length) c.crianca = 0; return c; });
      if (r.entrega.tipo === "retirada") r.entrega = { tipo: "retirada", frete: 0, endereco: "", cep: "", rastreio: "" };
      else if (r.entrega.tipo === "sedex") r.entrega.embalagem = embalagemDe(r.itens) || "";
      // campos resumidos, usados na busca e por pedidos antigos
      r.aluno = juntar(r.criancas.map(k => k.nome).filter(Boolean));
      r.tema = juntar([...new Set(r.criancas.map(k => k.tema).filter(Boolean))]);
      r.escola = r.criancas[0].escola || ""; r.serie = r.criancas[0].serie || "";
      if (!r.aluno && !r.responsavel) { toast("Preencha o nome da criança ou do responsável."); return; }
      if (!r.numero) r.numero = state.pedidos.reduce((m, p) => Math.max(m, Number(p.numero) || 0), 0) + 1;
      delete r.exemplo;
      const btn = document.getElementById("salvar"); btn.disabled = true;
      if (r.responsavel) {
        const c = (r.telefone && state.clientes.find(c => digits(c.telefone) === r.telefone)) || state.clientes.find(c => norm(c.nome) === norm(r.responsavel));
        const cid = c ? c.id : newId();
        r.clienteId = cid;
        if (!c || c.nome !== r.responsavel || (r.telefone && digits(c.telefone) !== r.telefone)) { try { await salvarCliente({ id: cid, nome: r.responsavel, telefone: r.telefone || (c && c.telefone) || "" }); } catch (e) { /* o pedido ainda é salvo */ } }
      }
      try { await run(() => salvarPedido(r), orig ? "Pedido atualizado" : `Pedido nº ${r.numero} criado`); painel = null; render(); abrirDetalhe(r.id); }
      catch (e) { btn.disabled = false; }
    };
  }

  document.getElementById("btn-novo").onclick = () => abrirEditor(null);
  ["pedidos", "clientes", "catalogo"].forEach(t => document.getElementById("tab-" + t).onclick = () => { state.tab = t; render(); });
  window.__teste = { lerMensagem, totais, msgCliente };
  render();
  iniciar();
})();
</script>
</body>
</html>
